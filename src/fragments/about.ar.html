<p class="prose">القوانين التي تحمي الحيوانات موجودة في النصوص. أما مدى تطبيقها، فنادرًا ما يُقاس.</p>
<p class="prose"><bdi lang="en">Animal Crime Bureau (ACB)</bdi> جهة مستقلة للتحقيق القانوني. توثّق الجرائم الواقعة على الحيوانات، وتقيس تطبيق القانون بالمعيار الذي يحيل إليه القانون نفسه.</p>
